services:
  - type: web
    name: control-horas
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_TZ
        value: America/Caracas
      - key: DATABASE_URL
        fromDatabase:
          name: control-horas-db
          property: connectionString
databases:
  - name: control-horas-db
    plan: free
